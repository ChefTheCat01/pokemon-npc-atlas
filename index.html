<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon NPC Atlas</title>


    <!-- Leaflet CSS -->
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />


    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 700px;
            background: #d8d8d8;
        }

        /* Custom status markers */

.status-marker {
    background: transparent;
    border: none;
}

.status-pin {
    width: 24px;
    height: 24px;

    border: 2px solid white;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
}


/* Available */
.status-available {
    background: #2f80ed;
}


/* Reserved */
.status-reserved {
    background: #f2c94c;
}


/* Claimed */
.status-claimed {
    background: #d64545;
}

  /* Map legend */

.map-legend {
    background: rgba(255, 255, 255, 0.92);
    padding: 8px 10px;
    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 20px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
}

.map-legend strong {
    display: block;
    margin-bottom: 4px;
}

.legend-dot {
    display: inline-block;

    width: 12px;
    height: 12px;

    margin-right: 6px;

    border: 1px solid white;
    border-radius: 50%;

    vertical-align: -1px;
}

.legend-available {
    background: #2f80ed;
}

.legend-reserved {
    background: #f2c94c;
}

.legend-claimed {
    background: #d64545;
}   

        /* Region selector */

.region-control {
    background: rgba(255, 255, 255, 0.95);
    padding: 8px 10px;

    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 13px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
}

.region-control label {
    display: block;
    font-weight: bold;
    margin-bottom: 4px;
}

.region-control select {
    min-width: 130px;

    padding: 5px 7px;

    font-size: 13px;

    border: 1px solid #aaa;
    border-radius: 4px;

    background: white;
}

    </style>

</head>


<body>


    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>
    
    <script src="data/regions.js"></script>


    <script>


    // Create a non-geographical Leaflet map.
    const map = L.map('map', {
    crs: L.CRS.Simple,

    // Temporarily allow negative zoom levels so
    // fitBounds can show the entire region.
    minZoom: -3,

    // Allow smoother fractional fitting.
    zoomSnap: 0.1,
    zoomDelta: 0.5,

    // Keep the map inside its intended area.
    maxBoundsViscosity: 1.0
});


    // Choose the starting region.
const startingRegion = regionData.Kanto;


// Build the Leaflet bounds from the region data.
const bounds = [
    [0, 0],
    [
        startingRegion.height,
        startingRegion.width
    ]
];


// Place the region image onto the Leaflet map.
const regionMap = L.imageOverlay(
    startingRegion.image,
    bounds,
    {
        alt: 'Map of the ' + startingRegion.name + ' region'
    }
).addTo(map);


    // Show the entire region on initial load.
    map.fitBounds(bounds);


    // The initial full-map view becomes our
    // maximum zoom-out distance.
    const minimumZoom = map.getZoom();

    map.setMinZoom(minimumZoom);


    // Restrict panning to Kanto.
    map.setMaxBounds(bounds);

        // Status legend

const legend = L.control({
    position: 'bottomleft'
});


legend.onAdd = function() {

    const div = L.DomUtil.create(
        'div',
        'map-legend'
    );

    div.innerHTML =
        '<strong>NPC Status</strong>' +

        '<span class="legend-dot legend-available"></span>' +
        'Available<br>' +

        '<span class="legend-dot legend-reserved"></span>' +
        'Reserved<br>' +

        '<span class="legend-dot legend-claimed"></span>' +
        'Claimed';

    return div;

};


legend.addTo(map);
        
        // Region selector

const regionControl = L.control({
    position: 'topright'
});


regionControl.onAdd = function() {

    const div = L.DomUtil.create(
        'div',
        'region-control'
    );


    div.innerHTML =
    '<label for="region-select">Region</label>' +
    '<select id="region-select"></select>';


    // Prevent interaction with the dropdown
    // from also affecting the map.
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);


    return div;

};

regionControl.addTo(map);

// Build the region dropdown automatically
// from data/regions.js.

const regionSelect =
    document.getElementById('region-select');


Object.entries(regionData).forEach(function(
    [regionKey, region]
) {

    const option =
        document.createElement('option');

    option.value = regionKey;

    option.textContent = region.name;

    regionSelect.appendChild(option);

});

        // Switch between Pokémon regions.

function switchRegion(regionName) {

    const region = regionData[regionName];

    // Safety check in case an invalid region is requested.
    if (!region) {
        console.error('Unknown region:', regionName);
        return;
    }


    // Build this region's coordinate bounds.
    const newBounds = [
        [0, 0],
        [
            region.height,
            region.width
        ]
    ];


    // Temporarily allow Leaflet to zoom far enough out
    // to fit regions of different dimensions.
    map.setMinZoom(-3);


    // Change the existing image overlay.
    regionMap.setUrl(region.image);
    regionMap.setBounds(newBounds);


    // Update the image alt text.
    const imageElement = regionMap.getElement();

    if (imageElement) {
        imageElement.alt =
            'Map of the ' + region.name + ' region';
    }


    // Apply the new movement boundary.
    map.setMaxBounds(newBounds);


    // Show the whole new region.
    map.fitBounds(newBounds);


    // Make this full-region view the new
    // maximum zoom-out level.
    const newMinimumZoom = map.getZoom();

    map.setMinZoom(newMinimumZoom);


    // Close any popup left open from the old region.
    map.closePopup();


    // Refresh NPC markers for the selected region.
    createNpcMarkers(
        allNpcData,
        regionName
    );

}

        // Listen for region changes.


regionSelect.addEventListener('change', function() {

    switchRegion(this.value);

});


        // Layer group containing all visible NPC markers.

const npcMarkerLayer = L.layerGroup().addTo(map);
        
// Create a marker for every NPC in the NPC data file.

// Create all NPC markers from supplied data.

function createNpcMarkers(npcData, regionName) {

    // Remove markers from the previously displayed region.
    npcMarkerLayer.clearLayers();


    // Only keep NPCs belonging to the selected region.
    const regionNpcs = npcData.filter(function(npc) {

        return npc.region.trim().toLowerCase() ===
               regionName.trim().toLowerCase();

    });


    regionNpcs.forEach(function(npc) {

        const effectiveStatus =
    getEffectiveStatus(npc);


const statusClass =
    'status-' +
    effectiveStatus.trim().toLowerCase();


        const statusIcon = L.divIcon({

            className: 'status-marker',

            html:
                '<div class="status-pin ' +
                statusClass +
                '"></div>',

            iconSize: [28, 28],

            iconAnchor: [14, 28],

            popupAnchor: [0, -28]

        });


        const marker = L.marker(
            [
                npc.y,
                npc.x
            ],
            {
                icon: statusIcon
            }
        );


        marker.bindPopup(
            '<strong>' + npc.character + '</strong><br>' +
            npc.location + '<br>' +
            npc.region + '<br><br>' +
            '<strong>Status:</strong> ' + effectiveStatus
        );


        // Add the marker to the NPC group,
        // rather than directly to the map.
        marker.addTo(npcMarkerLayer);

    });

}
       // ======================================================
// GOOGLE SHEET DATA
// ======================================================


// Stores the full datasets.

let allNpcData = [];
let allClaimData = [];


// ------------------------------------------------------
// Determine the visible status of an NPC.
// Claim Board data overrides Atlas Data where applicable.
// ------------------------------------------------------

function getEffectiveStatus(npc) {

    const claim = allClaimData.find(function(entry) {
        return entry.id === npc.id;
    });


    // No Claim Board record for this NPC.
    if (!claim) {
        return npc.status;
    }


    const reservedBy =
        claim.reservedBy.trim();

    const decision =
        claim.decision.trim().toLowerCase();


    // Staff approved the reservation.
    if (decision === 'approved') {
        return 'Claimed';
    }


    // Staff declined the reservation.
    if (decision === 'declined') {
        return 'Available';
    }


    // Participant entered a username
    // and the request is awaiting review.
    if (reservedBy !== '') {
        return 'Reserved';
    }


    // Otherwise use the Atlas Data status.
    return npc.status;

}


// ------------------------------------------------------
// Load Google Charts / Visualization API
// ------------------------------------------------------

google.charts.load('current');

google.charts.setOnLoadCallback(function() {

    loadNpcData();
    loadClaimData();

});


// ======================================================
// ATLAS DATA
// ======================================================

function loadNpcData() {

    const sheetUrl =
        'https://docs.google.com/spreadsheets/d/1THddca69gjdWfcGbQGvLc85oWgkMU7pI-QwzbyAOW3E/gviz/tq?sheet=MapData&headers=1';


    const query =
        new google.visualization.Query(
            sheetUrl,
            {
                sendMethod: 'scriptInjection'
            }
        );


    query.setRefreshInterval(10);

    query.send(handleSheetResponse);

}


function handleSheetResponse(response) {

    if (response.isError()) {

        console.error(
            'Atlas Data error:',
            response.getMessage(),
            response.getDetailedMessage()
        );

        return;

    }


    const data =
        response.getDataTable();


    const npcData = [];


    for (
        let row = 0;
        row < data.getNumberOfRows();
        row++
    ) {

        const id =
            data.getValue(row, 0);

        const character =
            data.getValue(row, 1);

        const region =
            data.getValue(row, 2);

        const location =
            data.getValue(row, 3);

        const x =
            data.getValue(row, 4);

        const y =
            data.getValue(row, 5);

        const status =
            data.getValue(row, 6);


        // Ignore unfinished rows.
        if (
            !id ||
            !character ||
            !region ||
            !location ||
            x === null ||
            y === null ||
            !status
        ) {
            continue;
        }


        npcData.push({

            id: String(id),

            character: String(character),

            region: String(region),

            location: String(location),

            x: Number(x),

            y: Number(y),

            status: String(status)

        });

    }


    allNpcData = npcData;


    createNpcMarkers(
        allNpcData,
        regionSelect.value
    );

}


// ======================================================
// CLAIM BOARD DATA
// ======================================================

function loadClaimData() {

    const claimSheetUrl =
        'https://docs.google.com/spreadsheets/d/Y1WVZe7i43qbm__nk4wAFrn_zvUP0hcig7OcROO0Dk858/gviz/tq?sheet=Reserve%20NPC&headers=1';


    const claimQuery =
        new google.visualization.Query(
            claimSheetUrl,
            {
                sendMethod: 'scriptInjection'
            }
        );


    claimQuery.setRefreshInterval(10);

    claimQuery.send(handleClaimResponse);

}

function handleClaimResponse(response) {

    if (response.isError()) {

        console.error(
            'Claim Board error:',
            response.getMessage(),
            response.getDetailedMessage()
        );

        return;

    }


    const data =
        response.getDataTable();


    const claimData = [];


    for (
        let row = 0;
        row < data.getNumberOfRows();
        row++
    ) {

        const id =
            data.getValue(row, 0);


        if (!id) {
            continue;
        }


        claimData.push({

            id:
                String(
                    data.getValue(row, 0) || ''
                ),

            reservedBy:
                String(
                    data.getValue(row, 4) || ''
                ),

            decision:
                String(
                    data.getValue(row, 5) || ''
                )

        });

    }


    allClaimData = claimData;


    // Rebuild the visible markers using
    // the newest reservation information.

    if (allNpcData.length > 0) {

        createNpcMarkers(
            allNpcData,
            regionSelect.value
        );

    }

}
        
        
// TEMPORARY ORGANIZER TOOL:
// Click anywhere on the map to display and copy its coordinates.

map.on('click', function(e) {

    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);

    const currentRegion =
        document.getElementById('region-select').value;

    L.popup()
        .setLatLng(e.latlng)
        .setContent(
            '<strong>' + currentRegion + ' coordinates</strong><br>' +
            'X: ' + x + '<br>' +
            'Y: ' + y + '<br><br>' +
            '<button onclick="copyCoordinates(' +
            x + ',' + y +
            ')">Copy X & Y</button>'
        )
        .openOn(map);

});

        async function copyCoordinates(x, y) {

    // A tab between the values makes them paste
    // into two adjacent Google Sheets cells.
    const coordinateText =
        x + '\t' + y;

    try {

        await navigator.clipboard.writeText(
            coordinateText
        );

        console.log(
            'Coordinates copied:',
            x,
            y
        );

    } catch (error) {

        console.error(
            'Could not copy coordinates:',
            error
        );

    }

}

</script>
    
</body>

</html>
