<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon NPC Atlas</title>


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />


    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 700px;
            background: #d8d8d8;
        }

        /* Custom status markers */

.status-marker {
    background: transparent;
    border: none;
}

.status-pin {
    width: 24px;
    height: 24px;

    border: 2px solid white;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
}


/* Available */
.status-available {
    background: #2f80ed;
}


/* Reserved */
.status-reserved {
    background: #f2c94c;
}


/* Claimed */
.status-claimed {
    background: #d64545;
}

  /* Map legend */

.map-legend {
    background: rgba(255, 255, 255, 0.92);
    padding: 8px 10px;
    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 20px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
}

.map-legend strong {
    display: block;
    margin-bottom: 4px;
}

.legend-dot {
    display: inline-block;

    width: 12px;
    height: 12px;

    margin-right: 6px;

    border: 1px solid white;
    border-radius: 50%;

    vertical-align: -1px;
}

.legend-available {
    background: #2f80ed;
}

.legend-reserved {
    background: #f2c94c;
}

.legend-claimed {
    background: #d64545;
}      

    </style>

</head>


<body>


    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>

    <script src="data/npcs.js"></script>

    <script>


    // Create a non-geographical Leaflet map.
    const map = L.map('map', {
    crs: L.CRS.Simple,

    // Temporarily allow negative zoom levels so
    // fitBounds can show the entire region.
    minZoom: -3,

    // Allow smoother fractional fitting.
    zoomSnap: 0.1,
    zoomDelta: 0.5,

    // Keep the map inside its intended area.
    maxBoundsViscosity: 1.0
});


    // Kanto map dimensions:
    // Width:  2048 pixels
    // Height: 1448 pixels

    const bounds = [
        [0, 0],
        [1448, 2048]
    ];


    // Place the Kanto image onto the Leaflet map.
    const kantoMap = L.imageOverlay(
        'maps/kanto.png',
        bounds,
        {
            alt: 'Map of the Kanto region'
        }
    ).addTo(map);


    // Show the entire region on initial load.
    map.fitBounds(bounds);


    // The initial full-map view becomes our
    // maximum zoom-out distance.
    const minimumZoom = map.getZoom();

    map.setMinZoom(minimumZoom);


    // Restrict panning to Kanto.
    map.setMaxBounds(bounds);

        // Status legend

const legend = L.control({
    position: 'bottomleft'
});


legend.onAdd = function() {

    const div = L.DomUtil.create(
        'div',
        'map-legend'
    );

    div.innerHTML =
        '<strong>NPC Status</strong>' +

        '<span class="legend-dot legend-available"></span>' +
        'Available<br>' +

        '<span class="legend-dot legend-reserved"></span>' +
        'Reserved<br>' +

        '<span class="legend-dot legend-claimed"></span>' +
        'Claimed';

    return div;

};


legend.addTo(map);
        
// Create a marker for every NPC in the NPC data file.

npcData.forEach(function(npc) {

    // Convert the status into a CSS class.
    const statusClass =
        'status-' + npc.status.toLowerCase();


    // Create a custom marker coloured by status.
    const statusIcon = L.divIcon({

        className: 'status-marker',

        html:
            '<div class="status-pin ' +
            statusClass +
            '"></div>',

        iconSize: [28, 28],

        iconAnchor: [14, 28],

        popupAnchor: [0, -28]

    });


    const marker = L.marker(
        [
            npc.y,
            npc.x
        ],
        {
            icon: statusIcon
        }
    ).addTo(map);


    marker.bindPopup(
        '<strong>' + npc.character + '</strong><br>' +
        npc.location + '<br>' +
        npc.region + '<br><br>' +
        '<strong>Status:</strong> ' + npc.status
    );

});
        
// TEMPORARY ORGANIZER TOOL:
// Click anywhere on the map to display its coordinates.

map.on('click', function(e) {

    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);

    L.popup()
        .setLatLng(e.latlng)
        .setContent(
            '<strong>Map coordinates</strong><br>' +
            'X: ' + x + '<br>' +
            'Y: ' + y
        )
        .openOn(map);

});  


</script>
    
</body>

</html>
