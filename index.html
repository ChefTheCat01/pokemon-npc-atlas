<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon NPC Atlas</title>


    <!-- Leaflet CSS -->
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />


    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 700px;
            background: #d8d8d8;
        }

        /* Custom status markers */

.status-marker {
    background: transparent;
    border: none;
}

.status-pin {
    width: 24px;
    height: 24px;

    border: 2px solid white;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
}


/* Available */
.status-available {
    background: #2f80ed;
}


/* Reserved */
.status-reserved {
    background: #f2c94c;
}


/* Claimed */
.status-claimed {
    background: #d64545;
}

        /* Example NPC */
.status-example {
    background: #9b51e0;
}

        /* Trainer sprite attached to map marker */

.trainer-sprite-marker {
    background: transparent;
    border: none;
}

.trainer-marker-wrap {
    position: relative;

    width: 52px;
    height: 72px;
}

.trainer-marker-sprite {
    position: absolute;

    left: 2px;
    top: 0;

    width: 48px;
    height: 48px;

    object-fit: contain;

    image-rendering: pixelated;

    pointer-events: none;

    filter: drop-shadow(
        0 2px 2px rgba(0, 0, 0, 0.45)
    );
}

.trainer-status-pin {
    position: absolute;

    left: 14px;
    bottom: 1px;

    width: 24px;
    height: 24px;

    box-sizing: border-box;

    border: 2px solid white;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    box-shadow:
        0 1px 5px rgba(0, 0, 0, 0.5);
}


/* Trainer sprite inside popup */

.npc-popup-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.npc-popup-sprite {
    width: 64px;
    height: 64px;

    object-fit: contain;

    flex-shrink: 0;

    image-rendering: pixelated;
}

.npc-popup-meta {
    min-width: 0;
}

/* Example dialogue */

.example-dialogue {
    margin-top: 10px;
    padding-top: 8px;

    border-top: 1px solid #ddd;

    font-style: italic;
    line-height: 1.4;
}

.example-label {
    display: inline-block;

    margin-top: 8px;
    padding: 2px 6px;

    border-radius: 4px;

    background: #9b51e0;
    color: white;

    font-size: 11px;
    font-weight: bold;
}

  /* Map legend */

.map-legend {
    background: rgba(255, 255, 255, 0.92);
    padding: 8px 10px;
    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 20px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
}

.map-legend strong {
    display: block;
    margin-bottom: 4px;
}

.legend-dot {
    display: inline-block;

    width: 12px;
    height: 12px;

    margin-right: 6px;

    border: 1px solid white;
    border-radius: 50%;

    vertical-align: -1px;
}

.legend-available {
    background: #2f80ed;
}

.legend-reserved {
    background: #f2c94c;
}

.legend-claimed {
    background: #d64545;
}   

        /* Region selector */

.region-control {
    background: rgba(255, 255, 255, 0.95);
    padding: 8px 10px;

    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 13px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
}

.region-control label {
    display: block;
    font-weight: bold;
    margin-bottom: 4px;
}

.region-control select {
    min-width: 130px;

    padding: 5px 7px;

    font-size: 13px;

    border: 1px solid #aaa;
    border-radius: 4px;

    background: white;
}

        /* Quick links */

.quick-links-control {
    display: flex;
    flex-direction: column;
    gap: 6px;

    font-family: Arial, sans-serif;
}

.quick-link-button {
    display: flex;
    align-items: center;

    min-width: 150px;

    padding: 7px 10px;

    background: rgba(255, 255, 255, 0.95);

    border-radius: 6px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);

    color: #222;
    text-decoration: none;

    font-size: 13px;
    font-weight: bold;
}

.quick-link-button:hover {
    background: white;
}


/* Reserved space for button images/logos */

.quick-link-icon {
    width: 22px;
    height: 22px;

    margin-right: 8px;

    flex-shrink: 0;

    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

     /* Smooth region image transition */

.region-map-image {
    transition: opacity 0.25s ease-in-out;
}  

     /* Sprite credits button */

.sprite-credits-control {
    font-family: Arial, sans-serif;
}

.sprite-credits-button {
    display: inline-block;

    padding: 7px 10px;

    background: rgba(255, 255, 255, 0.95);

    border-radius: 6px;

    box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);

    color: #222;
    text-decoration: none;

    font-size: 12px;
    font-weight: bold;
}

.sprite-credits-button:hover {
    background: white;
}   

    </style>

</head>


<body>


    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>
    
    <script src="data/regions.js"></script>
    <script src="data/trainer-sprites.js"></script>


    <script>


    // Create a non-geographical Leaflet map.
    const map = L.map('map', {
    crs: L.CRS.Simple,

    // Temporarily allow negative zoom levels so
    // fitBounds can show the entire region.
    minZoom: -3,

    // Allow smoother fractional fitting.
    zoomSnap: 0.1,
    zoomDelta: 0.5,

    // Keep the map inside its intended area.
    maxBoundsViscosity: 1.0
});


    // Choose the starting region.
const startingRegion = regionData.Kanto;


// Build the Leaflet bounds from the region data.
const bounds = [
    [0, 0],
    [
        startingRegion.height,
        startingRegion.width
    ]
];


// Place the region image onto the Leaflet map.
const regionMap = L.imageOverlay(
    startingRegion.image,
    bounds,
    {
        alt: 'Map of the ' + startingRegion.name + ' region',
        opacity: 1,
        className: 'region-map-image'
    }
).addTo(map);


    // Show the entire region on initial load.
    map.fitBounds(bounds);


    // The initial full-map view becomes our
    // maximum zoom-out distance.
    const minimumZoom = map.getZoom();

    map.setMinZoom(minimumZoom);


    // Restrict panning to Kanto.
    map.setMaxBounds(bounds);

        // Status legend

const legend = L.control({
    position: 'bottomleft'
});


legend.onAdd = function() {

    const div = L.DomUtil.create(
        'div',
        'map-legend'
    );

    div.innerHTML =
        '<strong>NPC Status</strong>' +

        '<span class="legend-dot legend-available"></span>' +
        'Available<br>' +

        '<span class="legend-dot legend-reserved"></span>' +
        'Reserved<br>' +

        '<span class="legend-dot legend-claimed"></span>' +
'Claimed<br>' +

'<span class="legend-dot" style="background:#9b51e0;"></span>' +
'Example';

    return div;

};


legend.addTo(map);

      // ======================================================
// SPRITE CREDITS
// ======================================================

const spriteCreditsControl = L.control({
    position: 'bottomleft'
});


spriteCreditsControl.onAdd = function() {

    const container = L.DomUtil.create(
        'div',
        'sprite-credits-control'
    );


    const link =
        document.createElement('a');

    link.className =
        'sprite-credits-button';

    link.href =
        'https://play.pokemonshowdown.com/sprites/trainers/?view=sprites&filter=credited';

    link.target =
        '_blank';

    link.rel =
        'noopener noreferrer';

    link.textContent =
        'Sprite Credits';

    link.title =
        'View trainer sprite artists and credits';


    container.appendChild(link);


    L.DomEvent.disableClickPropagation(
        container
    );

    L.DomEvent.disableScrollPropagation(
        container
    );


    return container;

};


spriteCreditsControl.addTo(map);  
        
        // Region selector

const regionControl = L.control({
    position: 'topright'
});


regionControl.onAdd = function() {

    const div = L.DomUtil.create(
        'div',
        'region-control'
    );


    div.innerHTML =
    '<label for="region-select">Region</label>' +
    '<select id="region-select"></select>';


    // Prevent interaction with the dropdown
    // from also affecting the map.
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);


    return div;

};

regionControl.addTo(map);

// Build the region dropdown automatically
// from data/regions.js.

const regionSelect =
    document.getElementById('region-select');


Object.entries(regionData).forEach(function(
    [regionKey, region]
) {

    const option =
        document.createElement('option');

    option.value = regionKey;

    option.textContent = region.name;

    regionSelect.appendChild(option);

});

        // Switch between Pokémon regions.

let regionSwitchToken = 0;


function switchRegion(regionName) {

    const region = regionData[regionName];

    if (!region) {
        console.error('Unknown region:', regionName);
        return;
    }


    // Prevent rapid region switching from allowing an
    // older image load to finish after a newer selection.
    const thisSwitch =
        ++regionSwitchToken;


    const newBounds = [
        [0, 0],
        [
            region.height,
            region.width
        ]
    ];


    // Close anything left open on the previous region.
    map.closePopup();


    // Remove the previous region's NPCs immediately.
    npcMarkerLayer.clearLayers();


    // Fade the current region out.
    regionMap.setOpacity(0);


    // Give the fade-out a moment to complete.
    setTimeout(function() {

        // Ignore this switch if the user has already
        // selected another region.
        if (thisSwitch !== regionSwitchToken) {
            return;
        }


        // Temporarily relax the zoom limit while
        // fitting the new region.
        map.setMinZoom(-3);


        // Change the coordinate area first.
        regionMap.setBounds(newBounds);


        // When the new artwork finishes loading,
        // fade it in and add the correct NPC markers.
        regionMap.once('load', function() {

            if (thisSwitch !== regionSwitchToken) {
                return;
            }


            regionMap.setOpacity(1);


            createNpcMarkers(
                allNpcData,
                regionName
            );

        });


        // Load the new map artwork.
        regionMap.setUrl(
            region.image
        );


        // Update accessibility text.
        const imageElement =
            regionMap.getElement();

        if (imageElement) {

            imageElement.alt =
                'Map of the ' +
                region.name +
                ' region';

        }


        // Apply the new navigation boundary.
        map.setMaxBounds(
            newBounds
        );


        // Re-centre the map while the artwork
        // is still faded out.
        map.fitBounds(
            newBounds,
            {
                animate: false
            }
        );


        // The full-map view becomes the new
        // maximum zoom-out level.
        const newMinimumZoom =
            map.getZoom();

        map.setMinZoom(
            newMinimumZoom
        );


    }, 250);

}

        // Listen for region changes.


regionSelect.addEventListener('change', function() {

    switchRegion(this.value);

    
});

        
// ======================================================
// QUICK LINKS
// ======================================================

const quickLinks = [

    {
        label: 'Claim Board',
        url: 'https://docs.google.com/spreadsheets/d/1WVZe7i43qbm__nk4wAFrn_zvUP0hcig7OcROO0Dk858/edit?gid=0#gid=0',
        icon: ''
    },

    {
        label: 'PS! The Library',
        url: 'http://play.pokemonshowdown.com/thelibrary',
        icon: ''
    },

    {
        label: 'Wifi Room',
        url: 'http://play.pokemonshowdown.com/wifi',
        icon: ''
    },

    {
        label: 'Event Info',
        url: 'https://docs.google.com/document/d/1ZwwVcfhvTrCddq6zZDEvea0Km_aK0dDLQOhB8YiEi3c/edit?tab=t.0',
        icon: ''
    }

];

        const quickLinksControl = L.control({
    position: 'topright'
});


quickLinksControl.onAdd = function() {

    const container = L.DomUtil.create(
        'div',
        'quick-links-control'
    );


    quickLinks.forEach(function(link) {

        const button =
            document.createElement('a');

        button.className =
            'quick-link-button';

        button.href =
            link.url;

        button.target =
            '_blank';

        button.rel =
            'noopener noreferrer';


        const icon =
            document.createElement('span');

        icon.className =
            'quick-link-icon';


        // Image support is already built in.
        // We'll supply the actual images later.
        if (link.icon) {

            icon.style.backgroundImage =
                'url("' + link.icon + '")';

        }


        const label =
            document.createElement('span');

        label.textContent =
            link.label;


        button.appendChild(icon);
        button.appendChild(label);

        container.appendChild(button);

    });


    // Don't let button interaction drag,
    // zoom or click through to the map.
    L.DomEvent.disableClickPropagation(
        container
    );

    L.DomEvent.disableScrollPropagation(
        container
    );


    return container;

};


quickLinksControl.addTo(map);


        // Layer group containing all visible NPC markers.

const npcMarkerLayer = L.layerGroup().addTo(map);
        
// Create a marker for every NPC in the NPC data file.

// Create all NPC markers from supplied data.

function formatPopupText(text) {

    const div =
        document.createElement('div');

    div.textContent =
        text || '';

    return div.innerHTML.replace(
        /\n/g,
        '<br>'
    );

}

        const trainerDisplayAliases = {

    // Outfit / environment variants
    'Ace Trainer Snow':
        'Ace Trainer',

    // Furisode Girl colour variants
    'Furisode Girl Black':
        'Furisode Girl',

    'Furisode Girl Blue':
        'Furisode Girl',

    'Furisode Girl Pink':
        'Furisode Girl',

    'Furisode Girl White':
        'Furisode Girl',

    // Team Star variants
    'Star Grunt S':
        'Star Grunt',

    'Star Grunt V':
        'Star Grunt'

};

     function getBaseTrainerClass(character) {

    let base =
        (character || '').trim();


    // Remove technical number / gender variants.
    //
    // Examples:
    // Swimmer 2f  -> Swimmer
    // Swimmer f   -> Swimmer
    // Fisherman 2 -> Fisherman
    // Ace Trainer Snow f -> Ace Trainer Snow

    base = base
        .replace(
            /\s+(?:\d+\s*[fm]?|[fm])$/i,
            ''
        )
        .trim();


    // Remove any named technical variant
    // that should not appear publicly.

    return (
        trainerDisplayAliases[base] ||
        base
    );

}

       function getNpcDisplayName(npc) {

    const character =
    getBaseTrainerClass(
        npc.character
    );
           
    const npcName =
        (npc.npcName || '').trim();


    if (npcName) {
        return character + ' ' + npcName;
    }


    return character;

}


function getTrainerSprite(npc) {

    // If the sprite registry has not loaded yet,
    // simply use the normal coloured pin.
    if (typeof trainerSprites === 'undefined') {
        return '';
    }


    const exactKey =
        (npc.character || '').trim();

    const baseKey =
        getBaseTrainerClass(
            exactKey
        );


    return (
        trainerSprites[exactKey] ||
        trainerSprites[baseKey] ||
        ''
    );

}
        
      let openNpcId = null;  
        
        function createNpcMarkers(npcData, regionName) {

        // Remember which NPC popup is currently open.
        // The marker layer is rebuilt whenever Google Sheets refreshes.

const npcToReopen =
    openNpcId;
            
            // Remove markers from the previously displayed region.
    npcMarkerLayer.clearLayers();


    // Only keep NPCs belonging to the selected region.
    const regionNpcs = npcData.filter(function(npc) {

        return npc.region.trim().toLowerCase() ===
               regionName.trim().toLowerCase();

    });


    regionNpcs.forEach(function(npc) {

        const effectiveStatus =
    getEffectiveStatus(npc);


// Example NPCs visually override
// the normal claim-board colours.

const statusClass =
    npc.example
        ? 'status-example'
        : 'status-' +
          effectiveStatus.trim().toLowerCase();


        const spriteUrl =
    getTrainerSprite(npc);


let statusIcon;


// If this trainer class has a sprite,
// use the combined sprite + coloured pin.

if (spriteUrl) {

    statusIcon = L.divIcon({

        className:
            'trainer-sprite-marker',

        html:
            '<div class="trainer-marker-wrap">' +

                '<img ' +
                    'class="trainer-marker-sprite" ' +
                    'src="' + spriteUrl + '" ' +
                    'alt=""' +
                '>' +

                '<div class="trainer-status-pin ' +
                    statusClass +
                '"></div>' +

            '</div>',

        iconSize:
            [52, 72],

        // Bottom-centre of the combined marker
        // remains the actual map coordinate.
        iconAnchor:
            [26, 71],

        popupAnchor:
            [0, -67]

    });

}


// No registered sprite yet:
// keep using the ordinary coloured pin.

else {

    statusIcon = L.divIcon({

        className:
            'status-marker',

        html:
            '<div class="status-pin ' +
            statusClass +
            '"></div>',

        iconSize:
            [28, 28],

        iconAnchor:
            [14, 28],

        popupAnchor:
            [0, -28]

    });

}


        const marker = L.marker(
    [
        npc.y,
        npc.x
    ],
    {
        icon: statusIcon,
        bubblingMouseEvents: false
    }
);


      let popupContent =
    '<div class="npc-popup-header">';


if (spriteUrl) {

    popupContent +=
        '<img ' +
            'class="npc-popup-sprite" ' +
            'src="' + spriteUrl + '" ' +
            'alt=""' +
        '>';

}


popupContent +=
    '<div class="npc-popup-meta">' +

        '<strong>' +
        formatPopupText(
            getNpcDisplayName(npc)
        ) +
        '</strong><br>' +

        formatPopupText(
            npc.location
        ) +
        '<br>' +

        formatPopupText(
            npc.region
        ) +

    '</div>' +

'</div>';
const hasDialogue =
    (npc.dialogue || '').trim() !== '';

const hasAuthor =
    (npc.author || '').trim() !== '';


// Show attribution / writing whenever supplied.
// The Example checkbox controls the purple pin,
// not whether dialogue is allowed to appear.

if (
    npc.example ||
    hasDialogue ||
    hasAuthor
) {

    popupContent += '<br>';


    if (hasAuthor || npc.example) {

        popupContent +=
            '<span class="example-label">' +
            formatPopupText(
                hasAuthor
                    ? npc.author
                    : 'Writing Example'
            ) +
            '</span>';

    }


    if (hasDialogue) {

        popupContent +=
            '<div class="example-dialogue">' +
            '“' +
            formatPopupText(npc.dialogue) +
            '”' +
            '</div>';

    }

}


// Normal NPCs still show their reservation status.

if (!npc.example) {

    popupContent +=
        '<br><br>' +
        '<strong>Status:</strong> ' +
        formatPopupText(effectiveStatus);

}

marker.bindPopup(
    popupContent,
    {
        maxWidth: 340,
        maxHeight: 260,

        // Clicking the map should not dismiss
        // a dialogue somebody is reading.
        closeOnClick: false,

        // Opening another NPC still closes
        // the previous one.
        autoClose: true,

        // Keep the popup visible while panning.
        keepInView: true
    }
);


marker.on('popupopen', function() {

    openNpcId =
        npc.id;

});


marker.on('popupclose', function() {

    if (openNpcId === npc.id) {

        openNpcId =
            null;

    }

});


        // Add the marker to the NPC group,
        // rather than directly to the map.
        marker.addTo(npcMarkerLayer);

        // If this NPC's popup was open before
// the 10-second data refresh, reopen it.

if (npc.id === npcToReopen) {

    marker.openPopup();

}

    });

}
       // ======================================================
// GOOGLE SHEET DATA
// ======================================================


// Stores the full datasets.

let allNpcData = [];
let allClaimData = [];


// ------------------------------------------------------
// Determine the visible status of an NPC.
// Claim Board data overrides Atlas Data where applicable.
// ------------------------------------------------------

function getEffectiveStatus(npc) {

    const claim = allClaimData.find(function(entry) {
        return entry.id === npc.id;
    });


    // No Claim Board record for this NPC.
    if (!claim) {
        return npc.status;
    }


    const reservedBy =
        claim.reservedBy.trim();

    const decision =
        claim.decision.trim().toLowerCase();


    // Staff approved the reservation.
    if (decision === 'approved') {
        return 'Claimed';
    }


    // Staff declined the reservation.
    if (decision === 'declined') {
        return 'Available';
    }


    // Participant entered a username
    // and the request is awaiting review.
    if (reservedBy !== '') {
        return 'Reserved';
    }


    // Otherwise use the Atlas Data status.
    return npc.status;

}


// ------------------------------------------------------
// Load Google Charts / Visualization API
// ------------------------------------------------------

google.charts.load('current');

google.charts.setOnLoadCallback(function() {

    loadNpcData();
    loadClaimData();

});


// ======================================================
// ATLAS DATA
// ======================================================

function loadNpcData() {

    const sheetUrl =
        'https://docs.google.com/spreadsheets/d/1THddca69gjdWfcGbQGvLc85oWgkMU7pI-QwzbyAOW3E/gviz/tq?sheet=MapData&headers=1';


    const query =
        new google.visualization.Query(
            sheetUrl,
            {
                sendMethod: 'scriptInjection'
            }
        );


    query.setRefreshInterval(30);

    query.send(handleSheetResponse);

}


function handleSheetResponse(response) {

    if (response.isError()) {

        console.error(
            'Atlas Data error:',
            response.getMessage(),
            response.getDetailedMessage()
        );

        return;

    }


    const data =
        response.getDataTable();


    const npcData = [];


    for (
        let row = 0;
        row < data.getNumberOfRows();
        row++
    ) {

        const id =
    data.getValue(row, 0);

const character =
    data.getValue(row, 1);

const npcName =
    data.getValue(row, 2);

const region =
    data.getValue(row, 3);

const location =
    data.getValue(row, 4);

const x =
    data.getValue(row, 5);

const y =
    data.getValue(row, 6);

const status =
    data.getValue(row, 7);

const dialogue =
    data.getValue(row, 8);

const exampleValue =
    data.getValue(row, 9);

        const author =
    data.getValue(row, 10);


        // Ignore unfinished rows.
        if (
            !id ||
            !character ||
            !region ||
            !location ||
            x === null ||
            y === null ||
            !status
        ) {
            continue;
        }


        npcData.push({

    id: String(id),

    character: String(character),

    npcName:
        String(npcName || ''),

    region: String(region),

    location: String(location),

    x: Number(x),

    y: Number(y),

    status: String(status),

    dialogue:
    String(dialogue || ''),

example:
    exampleValue === true ||
    String(exampleValue).toLowerCase() === 'true',

author:
    String(author || '')

});

    }


    allNpcData = npcData;

    
    createNpcMarkers(
        allNpcData,
        regionSelect.value
    );

}


// ======================================================
// CLAIM BOARD DATA
// ======================================================

function loadClaimData() {

    const claimSheetUrl =
        'https://docs.google.com/spreadsheets/d/1WVZe7i43qbm__nk4wAFrn_zvUP0hcig7OcROO0Dk858/gviz/tq?sheet=Reserve%20NPC&headers=1';


    const claimQuery =
        new google.visualization.Query(
            claimSheetUrl,
            {
                sendMethod: 'scriptInjection'
            }
        );


    claimQuery.setRefreshInterval(30);

    claimQuery.send(handleClaimResponse);

}

function handleClaimResponse(response) {

    if (response.isError()) {

        console.error(
            'Claim Board error:',
            response.getMessage(),
            response.getDetailedMessage()
        );

        return;

    }


    const data =
        response.getDataTable();


    const claimData = [];


    for (
        let row = 0;
        row < data.getNumberOfRows();
        row++
    ) {

        const id =
            data.getValue(row, 0);


        if (!id) {
            continue;
        }


        claimData.push({

            id:
                String(
                    data.getValue(row, 0) || ''
                ),

            reservedBy:
                String(
                    data.getValue(row, 4) || ''
                ),

            decision:
                String(
                    data.getValue(row, 5) || ''
                )

        });

    }


    allClaimData = claimData;


    // Rebuild the visible markers using
    // the newest reservation information.

    if (allNpcData.length > 0) {

        createNpcMarkers(
            allNpcData,
            regionSelect.value
        );

    }

}
        
        
// ======================================================
// ORGANIZER COORDINATE TOOL
// Available only on the direct GitHub/admin atlas.
// Hidden on the public Library version.
// ======================================================

const urlParams =
    new URLSearchParams(window.location.search);

const isEmbedded =
    window.self !== window.top;

const isPublicView =
    urlParams.get('view') === 'public' ||
    isEmbedded;


// Only enable coordinates on the direct
// standalone GitHub version.

if (!isPublicView) {

    map.on('click', function(e) {

        const x =
            Math.round(e.latlng.lng);

        const y =
            Math.round(e.latlng.lat);

        const currentRegion =
            document.getElementById(
                'region-select'
            ).value;


        L.popup()
            .setLatLng(e.latlng)
            .setContent(
                '<strong>' +
                currentRegion +
                ' coordinates</strong><br>' +

                'X: ' + x + '<br>' +
                'Y: ' + y + '<br><br>' +

                '<button onclick="copyCoordinates(' +
                x + ',' + y +
                ')">Copy X & Y</button>'
            )
            .openOn(map);

    });

}

        async function copyCoordinates(x, y) {

    // A tab between the values makes them paste
    // into two adjacent Google Sheets cells.
    const coordinateText =
        x + '\t' + y;

    try {

        await navigator.clipboard.writeText(
            coordinateText
        );

        console.log(
            'Coordinates copied:',
            x,
            y
        );

    } catch (error) {

        console.error(
            'Could not copy coordinates:',
            error
        );

    }

}
