<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon NPC Atlas</title>


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />


    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 700px;
            background: #d8d8d8;
        }

    </style>

</head>


<body>


    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>


    <script>

       <script>

    // Create a non-geographical Leaflet map.
    const map = L.map('map', {
        crs: L.CRS.Simple,
        maxBoundsViscosity: 1.0
    });


    // Kanto map dimensions:
    // Width:  2048 pixels
    // Height: 1448 pixels

    const bounds = [
        [0, 0],
        [1448, 2048]
    ];


    // Place the Kanto image onto the Leaflet map.
    const kantoMap = L.imageOverlay(
        'maps/kanto.png',
        bounds,
        {
            alt: 'Map of the Kanto region'
        }
    ).addTo(map);


    // Show the entire region on initial load.
    map.fitBounds(bounds);


    // The initial full-map view becomes our
    // maximum zoom-out distance.
    const minimumZoom = map.getZoom();

    map.setMinZoom(minimumZoom);


    // Restrict panning to Kanto.
    map.setMaxBounds(bounds);


</script>
    
</body>

</html>
